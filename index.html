<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffd9e8">
<title>Pulse — соцсеть</title>
<!-- Inter подключается только как запасной шрифт для не-Apple устройств. На iPhone/Mac используется системный SF Pro. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --h:340; --blur:24px;
  --acc:hsl(var(--h) 85% 62%);
  --acc2:hsl(calc(var(--h) + 28) 92% 74%);
  --acc-soft:hsl(var(--h) 100% 95%);
  --ink:#2b1823; --muted:#92707f;
  --glass:rgba(255,255,255,.50); --glass-strong:rgba(255,255,255,.78);
  --stroke:rgba(255,255,255,.78); --line:rgba(190,110,145,.16);
  --shadow:0 14px 44px -14px hsl(var(--h) 70% 50% / .35);
  --bg1:#fff6fa; --bg2:#ffe3ef; --bg3:#fff;
  --r:28px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Inter,"Segoe UI",Roboto,system-ui,sans-serif;
}
[data-theme=dark]{
  --ink:#fdeef5; --muted:#c9a0b3;
  --glass:rgba(66,30,48,.48); --glass-strong:rgba(86,40,62,.78);
  --stroke:rgba(255,255,255,.16); --line:rgba(255,255,255,.10);
  --acc-soft:hsl(var(--h) 35% 24%);
  --bg1:#24101b; --bg2:#33162a; --bg3:#1a0b14;
  --shadow:0 14px 44px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;color:var(--ink);
  font:16px/1.5 var(--font);letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-optical-sizing:auto;
  background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  background-attachment:fixed;overflow-x:hidden;transition:background .5s,color .3s;
}
h1,h2,h3,b,.logo{letter-spacing:-.022em}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none}
body.inreels{overflow:hidden}
.blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75;animation:float 18s ease-in-out infinite}
.blob.b1{width:46vmax;height:46vmax;left:-12vmax;top:-10vmax;background:hsl(var(--h) 100% 82%)}
.blob.b2{width:38vmax;height:38vmax;right:-10vmax;top:18vh;background:hsl(calc(var(--h) + 40) 100% 86%);animation-delay:-6s}
.blob.b3{width:42vmax;height:42vmax;left:20vw;bottom:-18vmax;background:hsl(calc(var(--h) - 30) 100% 84%);animation-delay:-11s}
[data-theme=dark] .blob{opacity:.28}
.no-anim .blob{animation:none}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(5vmax,4vmax) scale(1.08)}66%{transform:translate(-4vmax,6vmax) scale(.94)}}

.glass{
  position:relative;background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(180%);backdrop-filter:blur(var(--blur)) saturate(180%);
  border:1px solid var(--stroke);border-radius:var(--r);
  box-shadow:var(--shadow),inset 0 1.5px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(255,255,255,.12);
}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,.18));opacity:.7}
[data-theme=dark] .glass::before{opacity:.18}

#app{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:14px 14px 130px}
.inreels #app{display:none}
.compact #app{max-width:620px}

.top{position:sticky;top:10px;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 18px;border-radius:999px;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px}
.logo i{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;box-shadow:0 4px 14px -2px var(--acc)}
.logo i svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.logo b{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.top-r{display:flex;gap:8px;align-items:center}
.ibtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--glass-strong);border:1px solid var(--stroke);transition:transform .2s;flex:none}
.ibtn:active{transform:scale(.9)}
.ibtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.av{--s:44px;width:var(--s);height:var(--s);flex:none;border-radius:50%;display:grid;place-items:center;font-size:calc(var(--s)*.5);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.7),0 6px 16px -6px rgba(0,0,0,.25);position:relative}

.filter{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px 14px 20px;margin-bottom:16px}
.filter h2{margin:0;font-size:18px}
.filter p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.sw{position:relative;width:56px;height:34px;flex:none;display:inline-block}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:2;width:100%;height:100%}
.sw span{position:absolute;inset:0;border-radius:999px;background:rgba(140,100,120,.28);transition:.3s;box-shadow:inset 0 2px 5px rgba(0,0,0,.12)}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 3px 9px rgba(0,0,0,.25);transition:.35s cubic-bezier(.3,1.5,.5,1)}
.sw input:checked+span{background:linear-gradient(135deg,var(--acc),var(--acc2))}
.sw input:checked+span::after{transform:translateX(22px)}
.sw input:active+span::after{width:34px}
.sw input:checked:active+span::after{transform:translateX(16px)}

.feed{display:flex;flex-direction:column;gap:16px}
.post{padding:18px 18px 12px}
.compact .post{padding:13px 14px 8px}
.post header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.who{display:flex;align-items:center;gap:12px;text-align:left;flex:1;min-width:0}
.who b{display:block;font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--muted);font-size:13px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--acc-soft);color:var(--acc);margin-left:6px;vertical-align:2px}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.post p{margin:0 0 12px;font-size:16.5px;white-space:pre-wrap;word-wrap:break-word}
.media{height:210px;border-radius:22px;display:grid;place-items:center;font-size:76px;margin-bottom:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);position:relative;overflow:hidden}
.compact .media{height:150px}
.media::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 15%,rgba(255,255,255,.55),transparent 55%)}
.pm{position:relative;border-radius:22px;overflow:hidden;margin-bottom:12px;container-type:inline-size;background:rgba(0,0,0,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.pm img,.pm video{display:block;width:100%;max-height:72vh;object-fit:contain}
.ovt{position:absolute;left:6%;right:6%;transform:translateY(-50%);text-align:center;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.5);pointer-events:none;line-height:1.15;word-wrap:break-word}
.foot{display:flex;gap:4px;border-top:1px solid var(--line);padding-top:8px}
.act{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:99px;color:var(--muted);font-weight:600;font-size:14.5px;transition:.2s}
.act:hover{background:var(--acc-soft);color:var(--acc)}
.act svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act.liked{color:var(--acc)}
.act.liked svg{fill:var(--acc);animation:pop .4s}
@keyframes pop{40%{transform:scale(1.35)}}
.comments{margin-top:6px;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.cm{display:flex;gap:10px;font-size:14.5px}
.cm div{background:var(--glass-strong);padding:8px 13px;border-radius:18px;border:1px solid var(--stroke)}
.cm b{font-size:13px}
.cform{display:flex;gap:8px;margin-bottom:6px}
input.t,textarea.t,select.t{width:100%;padding:12px 16px;border-radius:18px;border:1px solid var(--stroke);background:var(--glass-strong);outline:none;transition:.2s}
input.t:focus,textarea.t:focus{box-shadow:0 0 0 3px hsl(var(--h) 90% 70%/.4)}
textarea.t{resize:vertical;min-height:100px}

.chip{padding:7px 13px;border-radius:99px;font-weight:650;font-size:13.5px;background:var(--glass-strong);border:1px solid var(--stroke);transition:.2s;white-space:nowrap;box-shadow:0 3px 10px -4px rgba(0,0,0,.15)}
.chip:hover{transform:translateY(-1px)}
.chip:active{transform:scale(.95)}
.chip:disabled{opacity:.5;cursor:default;transform:none}
.chip.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent;box-shadow:0 6px 16px -4px var(--acc)}
.chip.ok{color:var(--acc)}
.chip.danger{color:#e0305a}
.btn{padding:12px 22px;border-radius:99px;font-weight:700;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 8px 22px -6px var(--acc);transition:.2s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:var(--glass-strong);color:var(--ink);box-shadow:none;border:1px solid var(--stroke)}
.lnk{color:var(--acc);font-weight:700;text-decoration:underline}

.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.empty big{display:block;font-size:46px;margin-bottom:8px}

.dock{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;gap:2px;padding:7px;border-radius:999px;max-width:calc(100vw - 16px)}
.inchat .dock{display:none}
.dock button{position:relative;display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:99px;font-weight:700;color:var(--muted);transition:.3s}
.dock button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.dock button.on{background:var(--glass-strong);color:var(--acc);box-shadow:0 4px 14px -4px var(--acc),inset 0 1px 0 #fff}
.dock button span.l{font-size:14.5px}
.dock .dot{position:absolute;top:4px;right:6px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--acc);color:#fff;font-size:11px;display:grid;place-items:center;border:2px solid #fff}
.fab{position:fixed;right:max(16px,calc(50% - 340px));bottom:calc(100px + env(safe-area-inset-bottom));z-index:29;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 12px 28px -6px var(--acc);transition:.25s}
.fab:hover{transform:scale(1.08) rotate(90deg)}
.fab svg{width:26px;height:26px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round}

.pcard{overflow:hidden;margin-bottom:16px}
.cover{height:130px;position:relative}
.pbody{padding:0 20px 20px;margin-top:-44px;position:relative}
.pbody .av{--s:92px;box-shadow:0 0 0 4px rgba(255,255,255,.85),0 10px 24px -8px rgba(0,0,0,.3)}
.pbody h1{margin:10px 0 0;font-size:26px;line-height:1.2}
.pbody .h{color:var(--muted)}
.pbody p{margin:8px 0 14px}
.stats{display:flex;gap:10px}
.stat{flex:1;text-align:center;padding:10px 4px;border-radius:20px;background:var(--glass-strong);border:1px solid var(--stroke)}
.stat b{display:block;font-size:20px}
.stat small{color:var(--muted);font-size:12.5px}
.tabs{display:flex;gap:4px;padding:5px;border-radius:99px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1;padding:10px 14px;border-radius:99px;font-weight:650;font-size:14px;color:var(--muted);white-space:nowrap;transition:.25s}
.tabs button.on{background:var(--glass-strong);color:var(--acc);box-shadow:0 3px 10px -3px var(--acc)}
.tabs i{font-style:normal;background:var(--acc);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:5px}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:24px}
.row .who{flex:1}
h3.sec{margin:18px 4px 10px;font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

.sgroup{padding:6px 18px;margin-bottom:16px}
.sgroup>h3{margin:14px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--acc)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow b{display:block;font-size:15.5px}
.srow small{color:var(--muted);font-size:13px;display:block;word-break:break-all}
.swatches{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.2);transition:.2s}
.swatch.on{transform:scale(1.2);box-shadow:0 0 0 2px var(--ink)}
.seg{display:flex;padding:3px;border-radius:99px;background:rgba(150,100,125,.15)}
.seg button{padding:6px 13px;border-radius:99px;font-size:13.5px;font-weight:650;color:var(--muted)}
.seg button.on{background:#fff;color:#c2336b;box-shadow:0 2px 8px rgba(0,0,0,.15)}
[data-theme=dark] .seg button.on{background:var(--glass-strong);color:#fff}
input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
input[type=range].full{width:100%}

.editor{padding:20px;display:flex;flex-direction:column;gap:14px}
.editor label,.lbl{font-size:13px;font-weight:700;color:var(--muted);display:block;margin:0 0 6px 4px}
.emojis{display:flex;flex-wrap:wrap;gap:8px}
.emojis button{min-width:44px;height:44px;padding:0 10px;border-radius:16px;font-size:22px;background:var(--glass-strong);border:1px solid var(--stroke);transition:.2s}
.emojis button.txt{font-size:13px;font-weight:650}
.emojis button.on{box-shadow:0 0 0 2.5px var(--acc);transform:scale(1.08)}
.hues{display:flex;flex-wrap:wrap;gap:10px}
.hues button{width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.2);transition:.2s}
.hues button.on{transform:scale(1.15);box-shadow:0 0 0 2.5px var(--ink)}
.mrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}

.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:end center;background:rgba(60,20,40,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .25s}
.ov.ed{z-index:60;background:rgba(60,20,40,.45)}
.ov.top{z-index:150}
@keyframes fade{from{opacity:0}}
.sheet{width:min(560px,100%);max-height:92vh;overflow:auto;padding:20px;border-radius:32px 32px 0 0;animation:up .4s cubic-bezier(.2,1,.3,1);background:var(--glass-strong)}
.sheet.wide{width:min(640px,100%)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet .x{position:absolute;right:14px;top:14px;z-index:2}
@media(min-width:700px){.ov{place-items:center;padding:20px}.sheet{border-radius:32px}}
.toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{padding:12px 20px;border-radius:99px;font-weight:600;font-size:14.5px;animation:drop .4s cubic-bezier(.2,1.2,.3,1);background:var(--glass-strong);text-align:center}
@keyframes drop{from{transform:translateY(-30px) scale(.9);opacity:0}}
.enter{animation:enter .5s cubic-bezier(.2,1,.3,1) both}
@keyframes enter{from{opacity:0;transform:translateY(16px)}}
.no-anim *,.no-anim *::before{animation-duration:.01ms!important}
.hint{color:var(--muted);font-size:13px;margin:6px 4px 0}

.sbar{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 18px;border-radius:999px;margin-bottom:14px}
.sbar svg{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round;flex:none}
.sbar input{flex:1;border:0;background:none;outline:none;padding:10px 4px;font-size:17px;min-width:0}
.sbar input::placeholder{color:var(--muted)}
.prow{padding:12px 14px;border-radius:24px;display:flex;flex-direction:column;gap:10px}
.prow .bio{color:var(--muted);font-size:13.5px;margin:-4px 0 0 58px}

/* Reels */
#reels{display:none;position:fixed;inset:0;z-index:5}
.inreels #reels{display:block}
.rscroll{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.rscroll::-webkit-scrollbar{display:none}
.reel{height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;justify-content:center;align-items:center}
.rframe{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;overflow:hidden;background:#1a0b14;container-type:inline-size;color:#fff;user-select:none}
@media(min-width:700px){.rframe{height:calc(100% - 24px);border-radius:34px;box-shadow:0 30px 80px -20px rgba(120,20,70,.5)}}
.rbg{position:absolute;inset:0;background:linear-gradient(160deg,var(--a),var(--b),var(--a));background-size:220% 220%;animation:bgmove 9s ease-in-out infinite}
@keyframes bgmove{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}
.remoji{position:absolute;left:50%;top:36%;font-size:34cqw;transform:translate(-50%,-50%);animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 12px 24px rgba(0,0,0,.25))}
@keyframes bob{0%,100%{transform:translate(-50%,-50%) rotate(-4deg)}50%{transform:translate(-50%,-56%) rotate(5deg)}}
.rmedia{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.kb{animation:kb 12s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.12)}}
.reel:not(.active) .anim,.reel.paused .anim{animation-play-state:paused}
.rshade{position:absolute;inset:0;background:linear-gradient(to top,rgba(30,5,20,.75),rgba(30,5,20,0) 45%,rgba(30,5,20,.25));pointer-events:none}
.rprog{position:absolute;left:14px;right:14px;top:14px;height:3px;background:rgba(255,255,255,.35);border-radius:3px;overflow:hidden;z-index:2}
.rprog i{display:block;height:100%;width:0;background:#fff;animation:prog 10s linear infinite}
@keyframes prog{to{width:100%}}
.rinfo{position:absolute;left:16px;right:84px;bottom:112px;z-index:2;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.rinfo b{font-size:16.5px;display:block}
.rinfo span{display:block;font-size:14.5px;margin-top:4px;line-height:1.35;white-space:pre-wrap}
.ract{position:absolute;right:10px;bottom:112px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:14px}
.ra{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:700;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.ra i{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);border:1px solid rgba(255,255,255,.4);transition:.2s}
.ra:active i{transform:scale(.88)}
.ra svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.ra.liked svg{fill:#ff4d8d;stroke:#ff4d8d;animation:pop .4s}
.rav{position:relative;margin-bottom:8px}
.rav .plus{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;font-size:15px;line-height:20px;border:2px solid #fff}

function reqWith(id){for(var i=0;i<D.reqs.length;i++){var r=D.reqs[i];if(r.from_id===id||r.to_id===id)return r}return null}
function fState(id){var r=reqWith(id);if(!r)return 'none';if(r.status==='accepted')return 'friend';return r.from_id===D.me.id?'sent':'incoming'}
function friendIds(){return D.reqs.filter(function(r){return r.status==='accepted'}).map(function(r){return r.from_id===D.me.id?r.to_id:r.from_id})}
function followBtn(id){
  return has(D.following,id)
   ?'<button class="chip ok" data-a="follow" data-u="'+id+'">✓ Вы подписаны</button>'
   :'<button class="chip pri" data-a="follow" data-u="'+id+'">Подписаться</button>';
}
function friendBtn(id){
  var s=fState(id);

  if(s==='sent')return '<button class="chip" data-a="cancelreq" data-u="'+id+'">⏳ Заявка отправлена</button>';
  if(s==='incoming')return '<button class="chip pri" data-a="accept" data-u="'+id+'">Принять заявку</button>';

var PSEL='id,user_id,kind,body,media_path,media_kind,media_flt,ov,emoji,created_at,profile:profiles!user_id('+PF+'),likes(count),comments(count)';
function norm(r){
  if(r.profile)D.P[r.profile.id]=r.profile;
  return {id:r.id,u:r.user_id,kind:r.kind,t:r.body||'',time:ago(r.created_at),path:r.media_path,
    mm:r.media_path?{k:r.media_kind,url:mediaUrl(r.media_path),flt:r.media_flt||'none',ov:r.ov||null}:null,

    l:(r.likes&&r.likes[0]&&r.likes[0].count)||0,c:(r.comments&&r.comments[0]&&r.comments[0].count)||0};
}
async function loadPosts(kind){

function findItem(id){
  var all=D.posts.concat(D.reels);

function ovHTML(ov){
  if(!ov||!ov.t)return '';
  return '<div class="ovt" style="top:'+(ov.y*100)+'%;color:'+esc(ov.c)+';font-size:'+(ov.s*100)+'cqw">'+esc(ov.t)+'</div>';
}
function mediaHTML(mm){
  if(mm.k==='img')return '<div class="pm"><img src="'+esc(mm.url)+'" alt="" loading="lazy"></div>';
  return '<div class="pm"><video src="'+esc(mm.url)+'" controls playsinline preload="metadata" style="filter:'+fltCss(mm.flt)+'"></video>'+ovHTML(mm.ov)+'</div>';

function pickFile(accept,cb){
  var i=document.createElement('input');i.type='file';i.accept=accept;i.style.display='none';
  i.onchange=function(){var f=i.files&&i.files[0];i.remove();if(f)cb(f)};
  document.body.appendChild(i);i.click();
}
function normImg(file,max){
  return new Promise(function(res,rej){
    var u=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      var s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
      var c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*s));c.height=Math.max(1,Math.round(im.naturalHeight*s));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
      c.toBlob(function(b){b?res(b):rej()},'image/jpeg',.9);
    };
    im.onerror=function(){URL.revokeObjectURL(u);rej()};
    im.src=u;
  });
}

function buildReels(keep){
  if(view!=='reels')return;
  var root=$('#reels'),old=$('.rscroll',root),top=keep&&old?old.scrollTop:0;
  var list=reelList(),h='';
  h+='<div class="rtop glass"><button class="ibtn" data-a="rmute" id="rmute">'+icon(reelMuted?'mute':'vol')+'</button>'+
    '<div class="seg"><button data-a="rfilter" data-v="all" class="'+(CFG.reelsF==='all'?'on':'')+'">Для вас</button><button data-a="rfilter" data-v="subs" class="'+(CFG.reelsF==='subs'?'on':'')+'">Подписки</button></div>'+
    '<button class="ibtn" data-a="newreel">'+icon('plus')+'</button></div><div class="rscroll">';
  if(!D.loaded.reels)h+='<section class="reel"><div class="glass empty" style="max-width:320px"><big>⏳</big>Загружаем Reels…</div></section>';
  else if(!list.length)h+='<section class="reel"><div class="glass empty" style="max-width:320px"><big>🎬</big><b>Здесь пока пусто</b><br>'+(CFG.reelsF==='subs'?'Подпишитесь на авторов во вкладке «Для вас».':'Загрузите первый Reels кнопкой «+» сверху!')+'</div></section>';
  list.forEach(function(r){h+=reelHTML(r)});
  root.innerHTML=h+'</div>';
  var sc=$('.rscroll',root);sc.scrollTop=top;
  if(io)io.disconnect();
  if(!window.IntersectionObserver)return;
  io=new IntersectionObserver(function(es){es.forEach(function(en){
    var s=en.target,v=s.querySelector('video');
    if(en.isIntersecting&&en.intersectionRatio>=.6){
      s.classList.add('active');s.classList.remove('paused');
      if(v){v.muted=reelMuted;var p=v.play();if(p&&p.catch)p.catch(function(){})}
    } else if(!en.isIntersecting||en.intersectionRatio<.3){s.classList.remove('active');if(v)v.pause()}
  })},{root:sc,threshold:[0,.3,.6]});
  $$('.reel',sc).forEach(function(s){
    io.observe(s);
    var v=s.querySelector('video');
    if(v)v.addEventListener('timeupdate',function(){var i=s.querySelector('.rprog i');if(i&&v.duration)i.style.width=(v.currentTime/v.duration*100)+'%'});
  });
}
function stopReels(){if(io){io.disconnect();io=null}var r=$('#reels');if(r)r.innerHTML=''}

function toggleReel(s){
  var v=s.querySelector('video');
  if(v){if(v.paused){var p=v.play();if(p&&p.catch)p.catch(function(){});s.classList.remove('paused')}else{v.pause();s.classList.add('paused')}}
  else s.classList.toggle('paused');
}

    function draw(c,W){
      var iw=img.naturalWidth,ih=img.naturalHeight,odd=E.rot%2;
      var rw=odd?ih:iw,rh=odd?iw:ih,ratio=E.asp==='orig'?rw/rh:E.asp,H=Math.round(W/ratio);
      c.width=W;c.height=H;
      var x=c.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,W,H);
      var sc=Math.max(W/rw,H/rh)*E.zoom;
      var mx=Math.max(0,(rw*sc-W)/2)/W,my=Math.max(0,(rh*sc-H)/2)/H;
      E.ox=clamp(E.ox,-mx,mx);E.oy=clamp(E.oy,-my,my);
      x.save();
      if(CF)x.filter=fcss();
      x.translate(W/2+E.ox*W,H/2+E.oy*H);x.rotate(E.rot*Math.PI/2);x.scale(sc,sc);
      x.drawImage(img,-iw/2,-ih/2);
      x.restore();

        var fs=t.s*H;x.font='800 '+fs+'px '+FONT;x.textAlign='center';x.textBaseline='middle';

        x.save();x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=fs*.2;x.fillStyle=t.c;x.fillText(t.t,t.x*W,t.y*H);x.restore();
        E.boxes[i]={x:(t.x*W-w/2)/W,y:(t.y*H-fs*.65)/H,w:w/W,h:fs*1.3/H};
        if(c===cv&&i===E.sel){x.save();x.strokeStyle='#fff';x.lineWidth=2;x.setLineDash([8,6]);x.strokeRect(t.x*W-w/2-8,t.y*H-fs*.7,w+16,fs*1.4);x.restore()}
      });

    function redraw(){draw(cv,720)}
    redraw();

    var drag=null;
    cv.addEventListener('pointerdown',function(e){
      var r=cv.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height,hit=-1;
      for(var i=E.boxes.length-1;i>=0;i--){var b=E.boxes[i];if(px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h){hit=i;break}}

      else if(a==='del'){if(E.sel>-1){E.texts.splice(E.sel,1);E.sel=-1;redraw()}else toast('Выберите текст на фото')}

        E.sel=-1;var out=document.createElement('canvas');draw(out,opt.out||1080);
        out.toBlob(function(b){URL.revokeObjectURL(url);closeEd();if(b)cb(b);else toast('Не удалось сохранить фото')},'image/jpeg',.9);
      }
    });

      else return;
      redraw();
    });
  }
}

async function doLogin(email,pw){

  }catch(e){
    if(/not confirmed/i.test((e.message||'')+(e.code||''))){
      AF={email:email,mode:'signup',tries:0};
      try{await authCall('/resend',{type:'signup',email:email})}catch(x){}

async function doReg(name,email,pw){
  var j=await authCall('/signup',{email:email,password:pw,data:{name:name}});
  if(j&&j.access_token){setSess(j);await finishAuth();return}
  var ids=(j&&j.user&&j.user.identities)||(j&&j.identities);
  if(ids&&ids.length===0)throw new Error('user_already_exists');
  AF={email:email,mode:'signup',tries:0};authStep='code';renderAuth();
}
async function verifyCode(v){
  if(!AF||AF.busy)return;
  if(!/^\d{6,8}$/.test(v)){aerr('Введите код из письма (6–8 цифр)');return}
  AF.busy=true;
  try{
    var j;
    try{j=await authCall('/verify',{type:'email',email:AF.email,token:v})}
    catch(e1){
      if(AF.mode==='signup'){try{j=await authCall('/verify',{type:'signup',email:AF.email,token:v})}catch(e2){throw e1}}
      else throw e1;
    }
    setSess(j);
    if(AF.mode==='recovery'){authStep='newpw';AF=null;renderAuth()}
    else{AF=null;await finishAuth()}
  }catch(e){
    if(AF){AF.tries++;
      if(AF.tries>=6){authStep='login';AF=null;renderAuth();setTimeout(function(){aerr('Слишком много неверных кодов. Попробуйте снова.')},50)}
      else{aerr(errText(e));var i=$('#auth input[name=c]');if(i){i.value='';i.focus()}}
    }
  }
  if(AF)AF.busy=false;
}

});

  var k=e.target.dataset&&e.target.dataset.k;if(!k)return;
  var v=e.target.type==='checkbox'?e.target.checked:+e.target.value;
  if(k==='filterOn'){CFG.filterOn=v;saveCfg();render(false);return}
  var key=k.split('.')[1];S[key]=v;saveCfg();applySettings();
  if(key==='hideLikes')render(false);
});
document.addEventListener('input',function(e){
  var t=e.target,k=t.dataset&&t.dataset.k;
  if(k==='S.blur'){S.blur=+t.value;document.documentElement.style.setProperty('--blur',S.blur+'px');saveCfg();return}
  if(t.id==='q'){
    sq=t.value;clearTimeout(sT);
    if(!sq.trim()){SR={list:[],loading:false};$('#fbody').innerHTML=feedBody();return}
    SR.loading=true;$('#fbody').innerHTML=searchRes();sT=setTimeout(runSearch,300);return;
  }
  if(t.name==='pw'&&$('#pwbar')){
    var s=pwScore(t.value),cols=['#e0305a','#e0305a','#f0a030','#7cc65a','#34d27b'],txt=['Слишком простой','Слабый','Средний','Хороший','Отличный'];
    var b=$('#pwbar');b.style.width=(t.value?(s+1)*20:0)+'%';b.style.background=cols[s];$('#pwtxt').textContent=t.value?txt[s]:'Надёжный пароль: буквы, цифры и символы';
  }
  if(t.name==='c'&&t.closest('form')&&t.closest('form').dataset.form==='code'){t.value=t.value.replace(/\D/g,'')}
});
document.addEventListener('submit',async function(e){
  var f=e.target,type=f.dataset.form;if(!type)return;e.preventDefault();
  if(f.dataset.busy)return;
  var fd=new FormData(f);
  try{
    if(type==='comment'||type==='rcomment'){
      var t=(fd.get('t')||'').trim();if(!t)return;
      var id=f.dataset.p;busy(f,true);
      var r=await rest('POST','comments',{post_id:id,user_id:D.me.id,body:t},'return=representation');
      D.C[id]=(D.C[id]||[]);D.C[id].push(r[0]);var it=findItem(id);if(it)it.c++;
      if(type==='rcomment'){reelCommentsModal(id);updReel(id)}else render(false);
      return;
    }
    if(type==='msg'){
      var tx=(fd.get('t')||'').trim();if(!tx||!CH)return;
      f.reset();
      var m=await rest('POST','messages',{chat_id:CH.id,sender:D.me.id,body:tx},'return=representation');
      if(m&&m[0]){CH.msgs.push(m[0]);renderMsgs(true)}
      return;
    }
    if(type==='compose'){busy(f,true);await submitCompose(fd);busy(f,false);return}
    if(type==='profile'){
      var h=(fd.get('handle')||'').trim().replace(/^@/,'').toLowerCase();
      if(!/^[a-z0-9._]{3,24}$/.test(h)){toast('Ник: 3–24 символа, латиница, цифры, точка и _');return}
      var nm=(fd.get('name')||'').trim();if(!nm){toast('Введите имя');return}
      busy(f,true);
      var row={name:nm,handle:h,bio:(fd.get('bio')||'').trim(),emoji:ED.emoji,hue:ED.hue,cover:ED.cover};
      await rest('PATCH','profiles?id=eq.'+D.me.id,row);
      Object.assign(D.me,row);D.P[D.me.id]=D.me;ED=null;toast('Профиль обновлён 💖');render(false);return;
    }
    if(type==='group'){
      var title=(fd.get('title')||'').trim(),ms=fd.getAll('m');
      if(!title){return}
      if(!ms.length){var ge=$('#gerr');if(ge)ge.textContent='Выберите хотя бы одного друга';return}
      busy(f,true);
      var cid=await rest('POST','rpc/create_group',{title:title,members:ms});
      await loadChats();toast('Группа создана 👥');await openChat(cid,{id:cid,kind:'group',title:title,members:[D.me.id].concat(ms)});return;
    }
    if(type==='gadd'){
      var ms2=fd.getAll('m');if(!ms2.length){var ge2=$('#gerr');if(ge2)ge2.textContent='Выберите хотя бы одного друга';return}
      busy(f,true);
      await rest('POST','rpc/add_group_members',{cid:CH.id,members:ms2});
      await loadChats();closeModal();toast('Участники добавлены');renderMsgs(false);render(false);return;
    }
    /* ----- авторизация ----- */
    if(type==='reg'){
      var em=(fd.get('email')||'').trim().toLowerCase(),pw=fd.get('pw')||'',pw2=fd.get('pw2')||'',nm2=(fd.get('name')||'').trim();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em))return aerr('Введите корректный адрес почты');
      if(pw.length<8)return aerr('Пароль должен быть не короче 8 символов');
      if(!/\d/.test(pw)||!/[A-Za-zА-Яа-я]/.test(pw))return aerr('Добавьте в пароль и буквы, и цифры');
      if(pw!==pw2)return aerr('Пароли не совпадают');
      busy(f,true);await doReg(nm2,em,pw);return;
    }
    if(type==='login'){
      var em2=(fd.get('email')||'').trim().toLowerCase(),pw3=fd.get('pw')||'';
      if(!em2||!pw3)return aerr('Введите почту и пароль');
      busy(f,true);await doLogin(em2,pw3);busy(f,false);return;
    }
    if(type==='forgot'){
      var em3=(fd.get('email')||'').trim().toLowerCase();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em3))return aerr('Введите корректный адрес почты');
      busy(f,true);
      await authCall('/otp',{email:em3,create_user:false});
      AF={email:em3,mode:'recovery',tries:0};authStep='code';renderAuth();return;
    }
    if(type==='newpw'){
      var p1=fd.get('pw')||'',p2=fd.get('pw2')||'';
      if(p1.length<8)return aerr('Пароль должен быть не короче 8 символов');
      if(p1!==p2)return aerr('Пароли не совпадают');
      busy(f,true);await authCall('/user',{password:p1},'PUT',sess.access_token);toast('Пароль обновлён ✅');await finishAuth();return;
    }
    if(type==='code'){await verifyCode((fd.get('c')||'').trim());return}
  }catch(err){
    if(['reg','login','forgot','newpw','code'].indexOf(type)>-1)aerr(errText(err));else handleErr(err);
    busy(f,false);
  }
  if(f.isConnected)busy(f,false);
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  if($('#modal2').firstChild)closeEd();else closeModal();
});
if(mq&&mq.addEventListener)mq.addEventListener('change',applySettings);

/* ================= ЗАПУСК ================= */
function showSetup(e){
  stopTimers();
  $('#view').innerHTML='<div class="glass setup"><h2 style="margin-top:0">⚙️ База данных ещё не настроена</h2>'+
   '<p>Сайт подключился к Supabase, но не нашёл нужные таблицы. Откройте <b>Supabase → SQL Editor</b>, вставьте содержимое файла <code>supabase-setup.sql</code> и нажмите <b>Run</b>. Затем нажмите кнопку ниже.</p>'+
   '<p class="hint">Техническая причина: '+esc((e&&e.message)||'')+'</p><button class="btn" data-a="retry">Проверить снова</button></div>';
  hideAuth();document.body.classList.remove('inreels','inchat');
}
async function bootApp(){
  try{
    $('#view').innerHTML='<div class="glass empty" style="margin-top:40px"><big>⏳</big>Загружаем Pulse…</div>';
    var uid=sess.user.id;
    var r=await Promise.all([
      rest('GET','profiles?select='+PF+'&id=eq.'+uid),
      rest('GET','follows?select=followee&follower=eq.'+uid+'&limit=1000'),
      rest('GET','friend_requests?select=*&or=(from_id.eq.'+uid+',to_id.eq.'+uid+')'),
      rest('GET','likes?select=post_id&user_id=eq.'+uid+'&limit=2000')
    ]);
    var me=r[0][0];
    if(!me){ // профиль не создался триггером — создаём сами
      var base=((sess.user.email||'user').split('@')[0].toLowerCase().replace(/[^a-z0-9._]/g,'')||'user').slice(0,16);
      if(base.length<3)base='user'+Math.floor(Math.random()*9000+1000);
      var ins=await rest('POST','profiles',{id:uid,handle:base+Math.floor(Math.random()*9000+1000),name:(sess.user.user_metadata&&sess.user.user_metadata.name)||base},'return=representation');
      me=ins[0];
    }
    D.me=me;D.P={};D.P[me.id]=me;
    D.following=r[1].map(function(x){return x.followee});
    D.reqs=r[2];D.liked=r[3].map(function(x){return x.post_id});
    D.posts=[];D.reels=[];D.chats=[];D.C={};D.loaded={};
    await ensureProfiles(D.following.concat(D.reqs.map(function(q){return q.from_id===uid?q.to_id:q.from_id})));
    if(!CFG.rememberFilter)CFG.filterOn=true;
    render(true);
    refreshData(view);
  }catch(e){
    if(isSetupErr(e))showSetup(e);
    else if(/Сессия истекла/.test(e.message||''))return;
    else{
      $('#view').innerHTML='<div class="glass setup"><h2 style="margin-top:0">Не удалось загрузить</h2><p>'+esc(errText(e))+'</p><button class="btn" data-a="retry">Повторить</button> <button class="btn ghost" data-a="logout">Выйти</button></div>';
    }
  }
}
applySettings();
if(sess&&sess.access_token){bootApp()}
else showAuth('login');
})();
</script>
